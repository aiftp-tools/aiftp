name: smoke

# Post-release smoke test for the published @aiftp-tools/cli npm
# package. Runs against the *latest* published version (NOT the
# current branch) so we catch regressions in the install + CLI
# entrypoint + MCP server that source-tree tests cannot see.
#
# Triggers:
#   - release: every published GitHub Release
#   - workflow_dispatch: manual button in the Actions tab
#   - schedule: Mondays 00:00 UTC = 09:00 JST so the team sees a
#     fresh signal at the start of the week.

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  wait-for-publish:
    name: wait for npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Wait for the release version on npm
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          expected_version="${RELEASE_TAG#v}"

          for attempt in {1..30}; do
            published_version="$(npm view @aiftp-tools/cli@latest version 2>/dev/null || true)"
            if [ "$published_version" = "$expected_version" ]; then
              echo "PASS: npm latest is $published_version"
              exit 0
            fi

            echo "Waiting for npm latest=$expected_version (attempt $attempt/30, current=${published_version:-unavailable})"
            sleep 30
          done

          echo "FAIL: npm latest did not reach $expected_version within 15 minutes"
          exit 1

  smoke:
    name: smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: wait-for-publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install the published CLI
        run: npm install -g @aiftp-tools/cli@latest

      - name: aiftp --version
        run: aiftp --version

      - name: doctor outside a project (sanity)
        shell: bash
        run: |
          # `aiftp doctor` without a .aiftp.toml should exit non-zero with
          # a clear error rather than crash. We accept either exit path —
          # the goal is "no uncaught exception", not a specific exit code.
          set +e
          mkdir -p ./smoke-tmp
          cd ./smoke-tmp
          aiftp doctor --json || true
          echo "doctor exited with $?"

      - name: init refuses non-TTY stdin
        shell: bash
        run: |
          # `aiftp init` must refuse to run without an interactive TTY
          # (security gate — prevents an automated pipe from creating
          # a profile with attacker-supplied credentials).
          set +e
          aiftp init </dev/null
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "FAIL: aiftp init succeeded on non-TTY stdin"
            exit 1
          fi
          echo "PASS: aiftp init refused non-TTY stdin (exit $rc)"

      - name: MCP smoke (stdio + tools/list)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./.github/workflows/scripts/mcp-smoke.sh

      - name: .mcpb asset is attached and well-formed
        if: github.event_name == 'release' && runner.os == 'macOS' && matrix.node == 22
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --pattern '*.mcpb' --dir ./mcpb-check
          bundle="./mcpb-check/aiftp-${version}.mcpb"
          test -f "$bundle" || { echo "FAIL: $bundle not attached to the release"; exit 1; }
          unzip -p "$bundle" manifest.json > ./mcpb-check/manifest.json
          node -e "
            const m = require('./mcpb-check/manifest.json');
            const expected = process.env.RELEASE_TAG.replace(/^v/, '');
            if (m.version !== expected) { console.error('FAIL: manifest ' + m.version + ' != ' + expected); process.exit(1); }
            if (m.name !== 'aiftp') { console.error('FAIL: manifest name ' + m.name); process.exit(1); }
            console.log('PASS: .mcpb ' + m.version);
          "
